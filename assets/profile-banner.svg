<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Nicolas Marques — Segurança da Informação, Python e SQL</title>
  <desc id="desc">Banner profissional com foco em projetos de segurança, automação e dados.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="0.55" stop-color="#0b1f33"/>
      <stop offset="1" stop-color="#0b3b46"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#7dd3fc" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#background)"/>
  <rect width="1200" height="300" rx="24" fill="url(#grid)"/>
  <circle cx="1080" cy="64" r="92" fill="#2dd4bf" opacity="0.08"/>
  <circle cx="1110" cy="250" r="145" fill="#38bdf8" opacity="0.06"/>
  <path d="M970 18 L1182 18 L1182 230" fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="2"/>
  <path d="M1008 56 L1144 56 L1144 192" fill="none" stroke="#2dd4bf" stroke-opacity="0.24" stroke-width="2"/>

  <g transform="translate(69 49)">
    <rect width="42" height="42" rx="10" fill="#0f766e"/>
    <path d="M21 7 L33 12 V21 C33 29 28 35 21 38 C14 35 9 29 9 21 V12 Z" fill="none" stroke="#ecfeff" stroke-width="2.4"/>
    <path d="M15 21 L19 25 L27 17" fill="none" stroke="#67e8f9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="127" y="76" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="3">PORTFÓLIO DE TECNOLOGIA</text>
  <text x="68" y="164" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="55" font-weight="750">NICOLAS MARQUES</text>
  <rect x="69" y="184" width="590" height="4" rx="2" fill="url(#accent)"/>
  <text x="69" y="225" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600">Segurança da Informação  •  Python  •  SQL</text>
  <text x="69" y="260" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="18">Automação, análise de dados e investigação de eventos</text>

  <g transform="translate(900 112)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 25 H52 L70 5 H127" stroke="#38bdf8" stroke-width="3" opacity="0.75"/>
    <path d="M0 58 H72 L91 78 H156" stroke="#2dd4bf" stroke-width="3" opacity="0.7"/>
    <path d="M31 91 H77 L96 111 H178" stroke="#94a3b8" stroke-width="2" opacity="0.48"/>
    <circle cx="0" cy="25" r="5" fill="#38bdf8"/>
    <circle cx="127" cy="5" r="5" fill="#38bdf8"/>
    <circle cx="0" cy="58" r="5" fill="#2dd4bf"/>
    <circle cx="156" cy="78" r="5" fill="#2dd4bf"/>
    <circle cx="31" cy="91" r="4" fill="#94a3b8"/>
    <circle cx="178" cy="111" r="4" fill="#94a3b8"/>
  </g>
</svg>

